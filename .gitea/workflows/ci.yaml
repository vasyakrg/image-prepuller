name: ci

# Один workflow на весь путь коммита: сначала гейты (test + helm), и только после
# них — сборка и публикация образа (и, если задан CHART_OCI_REPO, OCI-чарта).
# Раньше это были два независимых workflow (ci.yaml и build-image.yaml): они
# стартовали параллельно на один и тот же push, дублировали гейты и давали два
# прогона в списке. Зеркало `.github/workflows/ci.yaml`.
#
# Теги образа: <REGISTRY>/<IMAGE>:<short12> (+ latest на main), плюс smoke-test.
# Чарт публикуется только если задана переменная CHART_OCI_REPO.
#
# Required repository variables (Settings -> Actions -> Variables):
#   REGISTRY       registry host, e.g. gitea.example.com:5000 (no scheme)
#   IMAGE          image path inside the registry, e.g. ops/image-prepuller
#   CHART_OCI_REPO optional; when set, the chart is pushed to oci://REGISTRY/CHART_OCI_REPO
# Required repository secrets:
#   REGISTRY_USERNAME / REGISTRY_PASSWORD   registry credentials
#   REGISTRY_INSECURE  optional; "true" enables plain-HTTP registry access
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Зеркало модулей вместо vendor/ (ADR-001). direct — fallback, если зеркало недоступно.
  GOPROXY: https://proxy.golang.org,direct

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go mod download
        run: go mod download

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build linux/amd64 + linux/arm64
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "/tmp/prepuller-linux-$arch" ./cmd/prepuller
          done

      # Гейт ADR-001: новые зависимости без contract PR ломают сборку.
      - name: dependency boundary
        run: |
          go list -m all > /tmp/modules.txt
          if grep -q 'prometheus/client_golang' /tmp/modules.txt; then
            echo "prometheus/client_golang is forbidden by ADR-001"; exit 1
          fi

      # Достижимые уязвимости в зависимостях блокируют сборку: Dependabot видит граф
      # модулей, govulncheck — реальные пути вызова (ADR-001, «Обновление 2026-11-26»).
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install helm
        run: |
          curl -fsSL https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: helm lint
        run: |
          helm lint deploy/helm/image-prepuller
          # Both cluster overlays (master with hub, managed with spoke + agents)
          # must keep linting too.
          helm lint deploy/helm/image-prepuller -f deploy/values/hub-cluster.yaml
          helm lint deploy/helm/image-prepuller -f deploy/values/managed-cluster.yaml

      # Defaults plus every optional component: a broken template fails CI even
      # when it is disabled in the default values.
      - name: helm template
        run: |
          helm template ci deploy/helm/image-prepuller > /tmp/default.yaml
          helm template ci deploy/helm/image-prepuller \
            --api-versions monitoring.coreos.com/v1 \
            --set spoke.enabled=true \
            --set agent.enabled=true \
            --set hub.ingress.enabled=true \
            --set agent.networkPolicy.enabled=true \
            --set hub.serviceMonitor.enabled=true \
            --set hub.prometheusRule.enabled=true \
            --set agent.metrics.serviceMonitor.enabled=true \
            --set agent.metrics.prometheusRule.enabled=true \
            --set secret.auth.password=ci-password \
            --set secret.sessionSecret=ci-session-secret \
            --set secret.clusterToken=ci-cluster-token \
            > /tmp/full.yaml
          # Agent-only and hub-only installs: each must render without the other
          # component's objects.
          helm template ci deploy/helm/image-prepuller --set hub.enabled=false > /tmp/agent-only.yaml
          helm template ci deploy/helm/image-prepuller --set agent.enabled=false > /tmp/hub-only.yaml
          # The shipped overlays: master cluster (hub + agents + ingress) and
          # managed cluster (spoke + agents, no hub, no ingress).
          helm template ci deploy/helm/image-prepuller \
            -f deploy/values/hub-cluster.yaml \
            > /tmp/hub-cluster.yaml
          helm template ci deploy/helm/image-prepuller \
            -f deploy/values/managed-cluster.yaml \
            > /tmp/managed-cluster.yaml
          # Outbound ("pull") mode: the spoke dials the hub ingress. The render
          # must carry -hub-url and no hub-side env, and an empty URL must fail
          # the render with a clear message.
          helm template ci deploy/helm/image-prepuller \
            --set spoke.enabled=true \
            --set spoke.hub.enabled=true \
            --set spoke.hub.url=https://hub.example.com \
            --set hub.enabled=false \
            > /tmp/spoke-outbound.yaml
          if helm template ci deploy/helm/image-prepuller \
            --set spoke.enabled=true \
            --set spoke.hub.enabled=true \
            --set spoke.hub.url= \
            --set hub.enabled=false > /tmp/spoke-outbound-invalid.log 2>&1; then
            echo "expected helm template to fail without spoke.hub.url"; exit 1
          fi
          grep -q 'spoke.hub.url' /tmp/spoke-outbound-invalid.log
          # Monitoring objects are nested under the component whose series they
          # cover: a hub monitor without a hub, or agent rules without the agent
          # metrics listener, must fail with a clear message instead of rendering.
          if helm template ci deploy/helm/image-prepuller \
            --api-versions monitoring.coreos.com/v1 \
            --set hub.enabled=false --set hub.serviceMonitor.enabled=true \
            > /tmp/monitor-hub-invalid.log 2>&1; then
            echo "expected helm template to fail for hub.serviceMonitor without hub"; exit 1
          fi
          grep -q 'hub.serviceMonitor.enabled' /tmp/monitor-hub-invalid.log
          if helm template ci deploy/helm/image-prepuller \
            --api-versions monitoring.coreos.com/v1 \
            --set agent.metrics.enabled=false --set agent.metrics.prometheusRule.enabled=true \
            > /tmp/rules-agent-invalid.log 2>&1; then
            echo "expected helm template to fail for agent.metrics.prometheusRule without metrics"; exit 1
          fi
          grep -q 'agent.metrics.prometheusRule.enabled' /tmp/rules-agent-invalid.log
          # Flags must actually gate objects, not just render them disabled.
          ! grep -q 'kind: Deployment' /tmp/agent-only.yaml || { echo "agent-only render still has a Deployment"; exit 1; }
          grep -q 'kind: DaemonSet' /tmp/agent-only.yaml
          ! grep -q 'kind: DaemonSet' /tmp/hub-only.yaml || { echo "hub-only render still has a DaemonSet"; exit 1; }
          grep -q 'kind: Deployment' /tmp/hub-only.yaml
          grep -q 'kind: ServiceMonitor' /tmp/full.yaml
          grep -q 'kind: PrometheusRule' /tmp/full.yaml
          grep -q 'replacement: prepuller-agent' /tmp/full.yaml
          grep -q 'kind: Ingress' /tmp/hub-cluster.yaml
          grep -q 'name: ci-image-prepuller-spoke' /tmp/managed-cluster.yaml
          ! grep -q 'kind: Ingress' /tmp/managed-cluster.yaml || { echo "managed cluster must not render an Ingress"; exit 1; }
          ! grep -q -- '-role=hub' /tmp/managed-cluster.yaml || { echo "managed cluster must not render a hub container"; exit 1; }
          # Outbound mode wiring: the managed overlay dials the hub (-hub-url=)
          # and must never carry hub-side env; the hub overlay must register the
          # managed cluster in PREPULLER_MANAGED_CLUSTERS / its Secret key.
          grep -q -- '-hub-url=' /tmp/managed-cluster.yaml
          ! grep -q 'PREPULLER_MANAGED_CLUSTERS' /tmp/managed-cluster.yaml || { echo "managed cluster must not render hub-side managed-clusters env"; exit 1; }
          grep -q 'PREPULLER_MANAGED_CLUSTERS' /tmp/hub-cluster.yaml
          grep -q 'managed-clusters: "talos-prod-kz=' /tmp/hub-cluster.yaml
          grep -q 'talos-prod-kz=' deploy/values/hub-cluster.yaml
          grep -q -- '-hub-url=https://hub.example.com' /tmp/spoke-outbound.yaml
          grep -q -- '-workload-selector=prepull=true' /tmp/default.yaml
          grep -q -- '-workload-selector=prepull=true' /tmp/hub-cluster.yaml
          grep -q -- '-node-selector=!node-role.kubernetes.io/control-plane' /tmp/hub-cluster.yaml
          grep -q -- '-workload-selector=prepull=true' /tmp/managed-cluster.yaml
          grep -q -- '-node-selector=!node-role.kubernetes.io/control-plane' /tmp/managed-cluster.yaml
          # An empty selector must render no flag at all (manage everything).
          helm template ci deploy/helm/image-prepuller --set hub.workloadSelector= \
            --set hub.nodeLabelSelector= > /tmp/unscoped.yaml
          ! grep -q -- '-workload-selector=' /tmp/unscoped.yaml || { echo "empty workload selector still rendered a flag"; exit 1; }
          ! grep -q -- '-node-selector=' /tmp/unscoped.yaml || { echo "empty node selector still rendered a flag"; exit 1; }
          echo "rendered default: $(grep -c '^kind:' /tmp/default.yaml) objects"
          echo "rendered full:    $(grep -c '^kind:' /tmp/full.yaml) objects"
          echo "rendered agent-only: $(grep -c '^kind:' /tmp/agent-only.yaml) objects"
          echo "rendered hub-only:   $(grep -c '^kind:' /tmp/hub-only.yaml) objects"
          echo "rendered hub-cluster: $(grep -c '^kind:' /tmp/hub-cluster.yaml) objects"
          echo "rendered managed-cluster: $(grep -c '^kind:' /tmp/managed-cluster.yaml) objects"
          echo "rendered spoke-outbound: $(grep -c '^kind:' /tmp/spoke-outbound.yaml) objects"
          # The default image tag is Chart.appVersion, never a moving "latest".
          app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/image-prepuller/Chart.yaml)"
          grep -q "image-prepuller:${app_version}" /tmp/default.yaml
          ! grep -q "image-prepuller:latest" /tmp/default.yaml || { echo "default render uses a moving latest tag"; exit 1; }
          echo "default image tag: ${app_version}"

      - name: validate rendered YAML
        run: |
          # PyYAML is not guaranteed on the runner image; install it with fallbacks.
          python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --user pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import yaml
          for path in ("/tmp/default.yaml", "/tmp/full.yaml", "/tmp/agent-only.yaml", "/tmp/hub-only.yaml", "/tmp/hub-cluster.yaml", "/tmp/managed-cluster.yaml", "/tmp/spoke-outbound.yaml"):
              with open(path) as fh:
                  docs = [d for d in yaml.safe_load_all(fh) if d]
              if not docs:
                  raise SystemExit(path + ": no manifests rendered")
              print(path + ": " + str(len(docs)) + " manifests OK")
          PY

      # Chart and application share one version line (release tag vX.Y.Z requires
      # version == appVersion == X.Y.Z); catching a mismatch on the PR is cheaper
      # than failing the release tag check below.
      - name: chart version matches appVersion
        run: |
          version="$(awk '$1 == "version:" {print $2}' deploy/helm/image-prepuller/Chart.yaml)"
          app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/image-prepuller/Chart.yaml)"
          if [ -z "${version}" ] || [ -z "${app_version}" ]; then
            echo "could not read version/appVersion from Chart.yaml"; exit 1
          fi
          if [ "${version}" != "${app_version}" ]; then
            echo "Chart.yaml version ${version} != appVersion ${app_version}";
            echo "bump both together: chart and application are released as one tag";
            exit 1
          fi
  image:
    # PRs validate only; pushes build and publish.
    if: github.event_name != 'pull_request'
    needs: [test, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image reference
        id: meta
        run: |
          set -eu
          registry="${REGISTRY:?set the REGISTRY repository variable}"
          image="${IMAGE:?set the IMAGE repository variable}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          ref="${registry}/${image}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${ref}:${short_sha}" >> "$GITHUB_OUTPUT"
          echo "sha=${short_sha}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ vars.IMAGE }}

      - name: Log in to the registry
        run: |
          set -eu
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "${REGISTRY}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin
        env:
          REGISTRY: ${{ vars.REGISTRY }}

      - name: Set up buildx
        run: |
          docker buildx create --name prepuller --use --driver docker-container
          docker buildx inspect --bootstrap

      - name: Build and push (linux/amd64, linux/arm64)
        run: |
          set -eu
          registry="${REGISTRY:?}"
          insecure=""
          if [ "${REGISTRY_INSECURE:-false}" = "true" ]; then
            insecure="--allow-insecure-registry"
          fi
          # sha-<12> always; latest follows main; a release tag adds its version
          # (v0.7.0 -> 0.7.0) so image, chart and Helm app version agree.
          tags="--tag ${registry}/${IMAGE}:${SHORT_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags} --tag ${registry}/${IMAGE}:latest"
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              tags="${tags} --tag ${registry}/${IMAGE}:${GITHUB_REF_NAME#v}"
              ;;
          esac
          docker buildx build $insecure \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg GOPROXY="${GOPROXY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --cache-from "type=registry,ref=${registry}/${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${registry}/${IMAGE}:buildcache,mode=max" \
            $tags \
            --push \
            .
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ vars.IMAGE }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.sha }}
          REGISTRY_INSECURE: ${{ vars.REGISTRY_INSECURE }}

      - name: Smoke-test the published image (mock hub)
        run: |
          set -eu
          docker run --rm -d --name prepuller-smoke \
            -e PREPULLER_AUTH_USER=admin \
            -e PREPULLER_AUTH_PASS=admin \
            -e PREPULLER_SESSION_SECRET=smoke-secret \
            -p 18080:8080 \
            "${REGISTRY}/${IMAGE}:${SHORT_SHA}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then
              echo "healthz OK"; docker rm -f prepuller-smoke; exit 0
            fi
            sleep 1
          done
          echo "image did not become healthy"; docker logs prepuller-smoke || true
          docker rm -f prepuller-smoke || true
          exit 1
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ vars.IMAGE }}
          SHORT_SHA: ${{ steps.meta.outputs.sha }}

  chart:
    # The chart is published only from a release tag, and only after the image of
    # the same version is up: version, appVersion and the tag are one number
    # (v0.7.0 -> 0.7.0). Skipped when CHART_OCI_REPO is empty.
    if: startsWith(github.ref, 'refs/tags/v') && vars.CHART_OCI_REPO != ''
    needs: [test, helm, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the registry (OCI)
        run: |
          set -eu
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "${REGISTRY}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin
        env:
          REGISTRY: ${{ vars.REGISTRY }}

      - name: Check Chart.yaml version and appVersion against the tag
        run: |
          set -eu
          chart_version="$(awk '$1 == "version:" {print $2}' deploy/helm/image-prepuller/Chart.yaml)"
          chart_app_version="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/image-prepuller/Chart.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Chart.yaml: version=${chart_version} appVersion=${chart_app_version}; tag: ${GITHUB_REF_NAME}"
          if [ "${chart_version}" != "${tag_version}" ]; then
            echo "Chart.yaml version ${chart_version} does not match the release tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "${chart_app_version}" != "${tag_version}" ]; then
            echo "Chart.yaml appVersion ${chart_app_version} does not match the release tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Package and push the chart
        run: |
          set -eu
          helm package deploy/helm/image-prepuller --destination /tmp/chart
          helm push /tmp/chart/image-prepuller-*.tgz "oci://${REGISTRY}/${CHART_OCI_REPO}"
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          CHART_OCI_REPO: ${{ vars.CHART_OCI_REPO }}