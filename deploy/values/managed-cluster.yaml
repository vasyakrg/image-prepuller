# Overlay: MANAGED (spoke) cluster — no hub, no ingress: a headless spoke API
# plus a node agent on every node. The spoke dials the master cluster's hub
# ingress and holds that connection open (outbound/"pull" mode), so only egress
# managed-cluster -> hub:443 is required (docs/DEPLOY.md section 14.10).
#
# This repository is PUBLIC: real hostnames, IPs and pinned image tags belong in
# the private GitOps repository. Copy this file there and replace the
# placeholders; do not commit the filled-in copy here.
#
# Usage:
#   helm upgrade --install prepuller deploy/helm/image-prepuller \
#     --namespace prepuller --create-namespace -f <private-managed-overlay>.yaml
#
# The master cluster has its own overlay: deploy/values/hub-cluster.yaml.

image:
  repository: ghcr.io/vasyakrg/image-prepuller
  # Empty -> Chart.appVersion, the image of the same release. Pin the
  # sha-<commit> of the same build as the master cluster so both clusters run
  # identical code (docs/DEPLOY.md 14.2).
  tag: ""
  pullPolicy: IfNotPresent

hub:
  # No Web UI, no API, no ingress in this cluster: the hub lives in the master
  # cluster. hub.enabled=false also drops the hub RBAC it would not use.
  enabled: false

spoke:
  # Headless backend for exactly this cluster. This cluster's name plus this
  # release's cluster-token must be added to the hub's hub.managedClusters:
  #   hub.managedClusters: "talos-stage=<cluster token of this release>"
  enabled: true
  clusterName: talos-stage
  # Outbound ("pull") mode: the spoke dials the hub ingress and holds the
  # connection open. No ingress is needed on this cluster and no inbound route
  # from the hub; only egress from this cluster to the hub host on 443.
  # Replace the URL with the hub ingress host (hub.ingress.hosts[0].host).
  hub:
    enabled: true
    url: https://prepuller.example.com
  # Only workloads opted in with this label are listed, shown in the hub UI and
  # warmed in this cluster. "" = every workload.
  workloadSelector: "prepull=true"
  # Agents run on workers only (see agent.* below): control-plane nodes are out
  # of scope and never show up as offline slots. Set "" to include them.
  nodeLabelSelector: "!node-role.kubernetes.io/control-plane"
  # Exactly one replica in outbound mode: the hub command queue assumes a single
  # spoke replica.
  replicaCount: 1
  mock: false
  service:
    type: ClusterIP
    httpPort: 8081
    metricsPort: 9091

secret:
  # Cluster token of this spoke (PREPULLER_CLUSTER_TOKEN). The hub's
  # hub.managedClusters entry must carry it in outbound mode. Empty -> random on
  # install; then read it and paste it into the master overlay:
  #   kubectl -n prepuller get secret prepuller-image-prepuller-secret \
  #     -o jsonpath='{.data.cluster-token}' | base64 -d
  # Set it explicitly here if your GitOps flow cannot read the Secret back.
  clusterToken: ""

agent:
  enabled: true
  # Talos keeps containerd on the upstream path.
  criSocket: /run/containerd/containerd.sock
  diskPauseRatio: 0.78
  metrics:
    enabled: true
    serviceMonitor:
      # Scraped by the same Prometheus that scrapes the master cluster, or by a
      # local one: the agent monitor forces job="prepuller-agent".
      enabled: false
      labels:
        release: kube-prometheus-stack
    prometheusRule:
      # Agent-process alerts for this cluster. Keep off if only the master
      # cluster's Prometheus evaluates them.
      enabled: false
      labels:
        release: kube-prometheus-stack
  pull:
    registryProbe: true
    registryProbeTimeout: 5s
    stallWatch: true
    stallTimeout: 60s
    timeout: 10m
  # Agents run on workers only: spoke.nodeLabelSelector above excludes
  # control-plane nodes, so no control-plane toleration is needed. Add it back and
  # set spoke.nodeLabelSelector: "" if you want control-plane covered too.
  networkPolicy:
    enabled: false

# No hub here, so no hub ServiceMonitor; the spoke has its own /metrics if you
# need cluster-level series from this side (not chart-managed today).
# hub.prometheusRule (hub/cluster alert rules) is still rendered for a
# spoke-only release, because the spoke exposes the same cluster series on
# :9091. Enable it here only if this cluster's Prometheus evaluates the rules:
#   hub:
#     prometheusRule:
#       enabled: true
#
# Direct ("push") mode note: hub.remoteClusters with the in-cluster Service DNS
# (http://<release>-image-prepuller-spoke.<namespace>.svc:8081) only works when
# the hub shares this cluster's network, i.e. for a spoke in the same cluster.
# A separate managed cluster is registered in hub.managedClusters (outbound).
