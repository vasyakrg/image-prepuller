# Overlay: MASTER cluster — hub (Web UI + API + Prometheus) plus a node agent on
# every node. This is the cluster you open in the browser.
#
# On top of the chart defaults it fixes the Talos layout (ingress + cert-manager,
# a control-plane toleration), documents both ways to register a managed cluster,
# and spells out the two hub-side data features: the bounded pull-task history
# (on, paginated through GET /api/v1/pull-tasks) and the optional PostgreSQL
# statistics pipeline (off here; docs/DEPLOY.md 14.12). The chart generates the
# Secrets it needs; the production alternative (a pre-created Secret) is spelled
# out under secret: below.
#
# This repository is PUBLIC: real hostnames, IPs, issuer names and pinned image
# tags belong in the private GitOps repository. Copy this file there and replace
# the placeholders; do not commit the filled-in copy here.
#
# Usage:
#   helm upgrade --install prepuller deploy/helm/image-prepuller \
#     --namespace prepuller --create-namespace -f <private-hub-overlay>.yaml
#
# The managed (spoke) cluster has its own overlay: deploy/values/managed-cluster.yaml.
# Walkthrough, expected numbers and Talos gotchas: docs/DEPLOY.md section 14.

image:
  repository: ghcr.io/vasyakrg/image-prepuller
  # Empty -> Chart.appVersion, the image of the same release. For production pin
  # the sha-<commit> built from the SAME commit as the chart: a chart from main
  # with an older image exits with
  # "flag provided but not defined: -pull-timeout" (docs/DEPLOY.md 14.2).
  # Left empty on purpose here: the chart resolves it.
  tag: ""
  pullPolicy: IfNotPresent

# The hub lists Nodes and workloads through the Kubernetes API, and "get" on
# Secrets is what lets it resolve the imagePullSecrets of the workloads it warms.
# A node agent pulls through CRI, which never applies a pod's imagePullSecrets,
# so without that credential a private registry answers an anonymous 403 and the
# image stays missing on every node whose kubelet has not pulled it by chance.
# The chart grants only "get" (the controller never lists or writes Secrets);
# this is also the chart default. Set it to false when cluster policy forbids
# reading Secrets: such pulls then fail as registry-auth errors instead.
rbac:
  readSecrets: true

secret:
  # Chart-managed Secret, so this file carries no credentials: the auth password,
  # session secret and cluster/agent tokens are generated on install and reused
  # from the live Secret on upgrade (stable sessions, stable spoke tokens).
  #
  # Production instead owns the Secret outside this release: create it once with
  # the keys auth-user, auth-pass, session-secret, cluster-token, agent-token and
  # (for outbound clusters) the optional managed-clusters, then set
  # create: false + existingSecret: <name>. Nothing sensitive then sits in values
  # or in the Helm release history, and an upgrade can never silently rotate a
  # value — a new session-secret logs everyone out, a new cluster-token cuts off
  # the outbound spokes whose hub.managedClusters entry still carries the old one.
  # Read an auto-generated value back with:
  #   kubectl -n prepuller get secret prepuller-image-prepuller-secret \
  #     -o jsonpath='{.data.cluster-token}' | base64 -d
  create: true
  existingSecret: ""

hub:
  enabled: true
  replicaCount: 1
  mock: false
  clusterName: talos-prod
  # Keep the reconciler off for the first rollout: the first pass schedules a
  # large batch of pulls. Turn it on after the snapshot has been checked
  # (docs/DEPLOY.md 14.7).
  autoWarm: false
  # Bounded pull-task history served by GET /api/v1/pull-tasks with
  # limit/offset/state, kept by the hub for every cluster (docs/DEPLOY.md 14.11).
  # The provider snapshot only holds the last ~200 tasks, which is too little to
  # explain an incident an hour later; the history is the hub's own JSONL file.
  # It is enabled by the chart, explicit here because it needs a volume: the hub
  # runs with readOnlyRootFilesystem, so without the mount below the store would
  # fall back to memory only.
  pullHistory:
    enabled: true
    # Tasks kept across all clusters; an active pull is never evicted.
    limit: 2000
    # Empty -> emptyDir (chart sizeLimit 256Mi): best effort, the file survives a
    # container restart but not a pod reschedule. Set a pre-created PVC name for
    # durable history; it is mounted read-write at /var/lib/prepuller, so it must
    # be writable by uid/gid 65532 (the distroless nonroot image).
    existingClaim: ""
  cookieSecure: true
  # The hub is the only component with an ingress; it exposes the UI/API.
  ingress:
    enabled: true
    className: traefik
    annotations:
      # cert-manager's ingress-shim creates the Certificate for hub.ingress.tls.
      cert-manager.io/cluster-issuer: <cluster-issuer>
    hosts:
      - host: prepuller.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: prepuller-tls
        hosts:
          - prepuller.example.com
  # Managed clusters this hub drives.
  #
  # Outbound ("pull") mode, the default for managed clusters: each spoke dials
  # this hub's ingress and holds the connection open, so nothing has to be
  # reachable from here. PREPULLER_MANAGED_CLUSTERS format:
  #   "<cluster-name>=<cluster-token>"
  # The token must equal secret.clusterToken of that cluster's release
  # (deploy/values/managed-cluster.yaml). Read it on the managed cluster with:
  #   kubectl -n prepuller get secret prepuller-image-prepuller-secret \
  #     -o jsonpath='{.data.cluster-token}' | base64 -d
  # The chart renders this list as the "managed-clusters" key of its Secret. With
  # a pre-created Secret (secret.create=false) it renders nothing, so put exactly
  # this string under managed-clusters there instead; either way keep the real
  # token out of the values file:
  #   managedClusters: "talos-prod-kz=<cluster token of the managed release>"
  managedClusters: "talos-prod-kz=<cluster token of the managed release>"
  # Direct ("push") / legacy mode: the hub calls the spoke itself, so the hub
  # must be able to reach that URL (shared cluster network or a route into the
  # managed cluster). Format: "<name>=<url>=<cluster-token>". Leave empty to use
  # outbound mode only.
  remoteClusters: ""
  # Optional PostgreSQL statistics (docs/DEPLOY.md 14.12,
  # docs/adr/0002-postgres-statistics.md). On every interval the hub samples each
  # cluster and writes into the external database what Prometheus only shows as
  # "now": image lifetimes on nodes, image-collector (GC) runs, the lag between
  # an image being removed and pulled again, and a log of every pull task.
  # Off by default: with no DSN there is no writer goroutine and no connection,
  # and the hub never waits for PostgreSQL — a database outage is logged and the
  # same diff is retried on the next sample, so UI, metrics and pulls are
  # unaffected. Turn it on when you need history rather than a snapshot.
  #
  # enabled: true without a DSN fails the render on purpose: switching the
  # pipeline on is an explicit operator decision, not a silent no-op.
  stats:
    enabled: false
    # The DSN carries the database password: never put a real one here or in any
    # values file — this repository is public and values are stored in the Helm
    # release history. Leave dsn empty and use existingSecret below.
    dsn: ""
    # Secret with the DSN under hub.stats.secretKey. Create it once, e.g.:
    #   kubectl -n prepuller create secret generic prepuller-pg \
    #     --from-literal=stats-dsn='postgres://prepuller:<password>@<db-host>:5432/prepuller?sslmode=require'
    # then set enabled: true. The schema is created on the first connection, so
    # the user needs CREATE in the schema plus INSERT/SELECT/DELETE on the tables.
    existingSecret: prepuller-pg
    secretKey: stats-dsn
    # Sampling interval, row retention and prune cadence (PREPULLER_STATS_*);
    # snapshotTimeout and other knobs stay at the chart defaults. Sizes here are
    # an example: 90 days of samples pruned once a day.
    interval: 30s
    retention: 2160h
    pruneInterval: 24h
  # Only workloads opted in with this label are listed, shown in the UI and
  # warmed. Set it to "" to manage every workload in the cluster instead.
  workloadSelector: "prepull=true"
  # Agents run on workers only (see agent.* below): control-plane nodes are out
  # of scope, so they are not shown and their missing agents do not turn into
  # offline slots / permanent partial snapshots. This is the chart default; the
  # line stays explicit because the hub itself *is* tolerating the
  # control-plane taint below - a single-node/small Talos install that wants
  # control-plane coverage must clear it here.
  nodeLabelSelector: "!node-role.kubernetes.io/control-plane"
  # Small Talos installs have no untainted worker nodes, so the hub needs the
  # same toleration as the agent or its pod stays Pending.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # prometheus-operator monitoring lives under hub: the monitor selects the hub
  # metrics Service, so an agent-only/managed release has nothing to select.
  serviceMonitor:
    # scrapeTimeout stays at 15s: the hub bounds a snapshot at 3s while it waits
    # for dead agents, and the usual 10s drops the whole target during an incident.
    enabled: false
    labels:
      release: kube-prometheus-stack
    scrapeTimeout: 15s
  # Alert rules for the hub/cluster series (docs/alerts.md). Enable only when
  # prometheus-operator manages them in this cluster.
  prometheusRule:
    enabled: false
    labels:
      release: kube-prometheus-stack

# This release is the hub; it is not itself a spoke of another hub.
spoke:
  enabled: false

agent:
  enabled: true
  # Talos keeps containerd on the upstream path.
  criSocket: /run/containerd/containerd.sock
  diskPauseRatio: 0.78
  metrics:
    # Anonymous /metrics on :9444 (counters only). The chart renders a Service
    # whose endpoints are the node IPs because the agent is hostNetwork.
    enabled: true
    serviceMonitor:
      # Flip on when prometheus-operator scrapes this cluster; select the object
      # with a label your Prometheus picks up.
      enabled: false
      labels:
        release: kube-prometheus-stack
    prometheusRule:
      # Agent-process alerts (prepuller_agent_*). Separate from
      # hub.prometheusRule so they can be enabled or dropped on their own.
      enabled: false
      labels:
        release: kube-prometheus-stack
  pull:
    # docker.io is normally reachable directly from the nodes; if containerd
    # pulls through a mirror and the direct dial is blocked, set this to false.
    registryProbe: true
    registryProbeTimeout: 5s
    stallWatch: true
    stallTimeout: 60s
    timeout: 10m
  # Agents run on workers only: hub.nodeLabelSelector above excludes
  # control-plane nodes, so no control-plane toleration is needed here. If you do
  # want control-plane covered, add the toleration back and set
  # hub.nodeLabelSelector: "" (nodes outside the scope are never shown).
  # The agent runs with hostNetwork=true, so most CNIs never apply this policy;
  # restrict TCP 9443 (agent API) and 9444 (agent metrics) on the node firewall
  # when the node network is not private.
  networkPolicy:
    enabled: false
