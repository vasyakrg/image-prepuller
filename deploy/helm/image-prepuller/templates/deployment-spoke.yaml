{{- if .Values.spoke.enabled }}
{{- /*
  Outbound ("pull") mode (spoke.hub.enabled): the spoke dials the hub ingress and
  keeps that connection open, so this release needs no ingress and no inbound
  route from the hub. The spoke Service rendered by this chart is then only used
  for in-cluster liveness/metrics scraping, never for hub -> spoke traffic.
  The hub's command queue assumes a single spoke replica, hence the guards.
*/}}
{{- if .Values.spoke.hub.enabled }}
{{- if not .Values.spoke.hub.url }}
{{- fail "spoke.hub.enabled=true requires spoke.hub.url to be set (the hub ingress URL, e.g. https://prepuller.example.com)" }}
{{- end }}
{{- if gt (int .Values.spoke.replicaCount) 1 }}
{{- fail "spoke.hub.enabled requires spoke.replicaCount=1: the hub command queue is single-replica" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ip.fullname" . }}-spoke
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "spoke") | nindent 4 }}
spec:
  replicas: {{ .Values.spoke.replicaCount }}
  selector:
    matchLabels:
      {{- include "ip.selectorLabels" (dict "ctx" . "component" "spoke") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ip.labels" (dict "ctx" . "component" "spoke") | nindent 8 }}
      {{- $annotations := include "ip.podAnnotations" (dict "ctx" . "metrics" .Values.spoke.metrics.annotations "metricsPort" .Values.spoke.service.metricsPort) }}
      {{- if trim $annotations }}
      annotations:
        {{- $annotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ip.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: spoke
          image: {{ include "ip.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - -role=spoke
            {{- if .Values.spoke.mock }}
            - -mock
            {{- end }}
            - -http-addr=:{{ .Values.spoke.service.httpPort }}
            - -metrics-addr=:{{ .Values.spoke.service.metricsPort }}
            - -cluster-name={{ .Values.spoke.clusterName }}
            {{- if .Values.spoke.hub.enabled }}
            {{- /* Quoted: an unquoted URL with "#", ": " or "&" would not parse. */}}
            - {{ printf "-hub-url=%s" .Values.spoke.hub.url | quote }}
            - -hub-sync-interval={{ .Values.spoke.hub.syncInterval }}
            {{- end }}
            {{- with .Values.spoke.workloadSelector }}
            - {{ printf "-workload-selector=%s" . | quote }}
            {{- end }}
            {{- with .Values.spoke.nodeLabelSelector }}
            - {{ printf "-node-selector=%s" . | quote }}
            {{- end }}
          env:
            - name: PREPULLER_CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ip.secretName" . }}
                  key: cluster-token
            - name: PREPULLER_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ip.secretName" . }}
                  key: agent-token
            {{- with .Values.spoke.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.spoke.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.spoke.service.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.spoke.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.spoke.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spoke.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.spoke.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
