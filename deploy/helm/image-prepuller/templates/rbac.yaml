{{- if and .Values.rbac.create .Values.serviceAccount.create (or .Values.hub.enabled .Values.spoke.enabled) }}
# The controller lists Nodes and workload objects (Deployments, StatefulSets,
# DaemonSets) cluster-wide. It never writes to the Kubernetes API. Needed by the
# hub and by a live spoke (K8sProvider); an agent-only install gets no RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ip.rbacName" . }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "hub") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.rbac.readSecrets }}
  # imagePullSecrets: a node agent pulls through CRI, so a private registry
  # would answer 403 unless the controller hands it the same credential kubelet
  # would use. Only "get" is granted (the controller never lists Secrets), and
  # only for the names a workload references. Disable with rbac.readSecrets=false
  # if cluster policy forbids reading Secrets: pulls then stay anonymous and
  # such workloads fail with a registry-auth error.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ip.rbacName" . }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "hub") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ip.rbacName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
