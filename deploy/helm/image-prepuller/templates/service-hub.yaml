apiVersion: v1
kind: Service
metadata:
  name: {{ include "ip.fullname" . }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "hub") | nindent 4 }}
spec:
  type: {{ .Values.hub.service.type }}
  selector:
    {{- include "ip.selectorLabels" (dict "ctx" . "component" "hub") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.hub.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.hub.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
