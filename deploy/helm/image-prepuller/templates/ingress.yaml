{{- if .Values.hub.ingress.enabled }}
{{- if not .Values.hub.enabled }}
{{- fail "hub.ingress.enabled=true requires hub.enabled=true: the ingress exposes the hub UI/API" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ip.fullname" . }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "hub") | nindent 4 }}
  {{- with .Values.hub.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.hub.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.hub.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.hub.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "ip.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
