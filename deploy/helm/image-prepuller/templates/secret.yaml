{{- if or .Values.hub.enabled .Values.spoke.enabled .Values.agent.enabled }}
{{- if and (not .Values.secret.create) (not .Values.secret.existingSecret) }}
{{- fail "secret.create=false requires secret.existingSecret to be set" }}
{{- end }}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- /*
  Generated credentials must survive `helm upgrade`: a random value rendered
  from scratch on every upgrade would silently break sessions and the hub/agent
  token pair in already-running pods. Precedence per key:
    values.secret.*  >  value stored in the existing Secret  >  new random value
  `lookup` returns an empty object under `helm template`/`--dry-run`, so a
  rendered manifest still carries random values (fine for CI and fresh installs).
*/}}
{{- $name := include "ip.secretName" . }}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $prevData := dict }}
{{- if $prev }}
{{- $prevData = $prev.data | default dict }}
{{- end }}
{{- $authUser := .Values.secret.auth.user | default "admin" }}
{{- $authPass := .Values.secret.auth.password | default (get $prevData "auth-pass" | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $sessionSecret := .Values.secret.sessionSecret | default (get $prevData "session-secret" | default "" | b64dec) | default (randAlphaNum 64) }}
{{- $clusterToken := .Values.secret.clusterToken | default (get $prevData "cluster-token" | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $agentToken := .Values.secret.agentToken | default (get $prevData "agent-token" | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "shared") | nindent 4 }}
  annotations:
    # Generated values are reused from the live Secret on upgrade; set values or
    # secret.existingSecret to control them explicitly.
    "helm.sh/resource-policy": "keep"
type: Opaque
stringData:
  auth-user: {{ $authUser | quote }}
  auth-pass: {{ $authPass | quote }}
  session-secret: {{ $sessionSecret | quote }}
  cluster-token: {{ $clusterToken | quote }}
  agent-token: {{ $agentToken | quote }}
  {{- if .Values.hub.enabled }}
  # Outbound ("pull") mode: managed cluster name -> cluster token list for the
  # hub's PREPULLER_MANAGED_CLUSTERS. Only a hub consumes it.
  managed-clusters: {{ .Values.hub.managedClusters | quote }}
  {{- end }}
  {{- if .Values.secret.users }}
  users: {{ .Values.secret.users | quote }}
  {{- end }}
{{- end }}{{- end }}
