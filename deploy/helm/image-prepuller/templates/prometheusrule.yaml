{{- if and .Values.hub.prometheusRule.enabled (or .Values.hub.enabled .Values.spoke.enabled) }}
{{- include "ip.requireMonitoringCRD" (dict "ctx" . "flag" "hub.prometheusRule.enabled") }}
{{- $thresholds := .Values.hub.prometheusRule.thresholds }}
{{- /* annotations.title is the app name these rules belong to: alert routing,
       Alertmanager templates and dashboards in the ops stack group alerts by it. */}}
{{- $app := "prepuller-hub" }}
# PrometheusRule for prometheus-operator: hub/cluster series scraped from the
# hub (:9090) or a spoke (:9091). Rendered for a hub release and for a
# spoke-only release (the spoke exposes the same series). Agent-process rules
# are a separate object controlled by agent.metrics.prometheusRule.enabled
# (docs/alerts.md).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-rules" (include "ip.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ip.labels" (dict "ctx" . "component" "monitoring") | nindent 4 }}
    {{- with .Values.hub.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.hub.prometheusRule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: prepuller
      rules:
        # "and on" keeps the alert silent for cordoned or NotReady nodes:
        # an absent agent on such a node is expected, not an outage.
        - alert: PrepullerNodeAgentDown
          expr: prepuller_node_agent_up == 0 and on(cluster,node) prepuller_node_ready == 1
          for: {{ $thresholds.nodeAgentDown }}s
          labels:
            severity: critical
          annotations:
            title: {{ $app }}
            summary: Node agent is down on a Ready node
            description: The hub cannot reach the node agent for {{ $thresholds.nodeAgentDown }}s while the node is Ready. Check the DaemonSet pod, tolerations and node networking.

        - alert: PrepullerNodeAgentAuthErrors
          expr: increase(prepuller_node_agent_errors_total{reason="unauthorized"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Hub gets 401 from node agents
            description: The hub's agent token is rejected by node agents. Check PREPULLER_AGENT_TOKEN on the hub and the agents.

        # Expected while an agent is deliberately absent (nodeSelector,
        # tolerations, a node being drained); alert only on a long partial sync.
        - alert: PrepullerClusterPartial
          expr: prepuller_cluster_sync_partial == 1
          for: {{ $thresholds.clusterPartial }}s
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Cluster snapshot has been partial for a long time
            description: Some node agents do not report inventory for {{ $thresholds.clusterPartial }}s. A deliberately excluded node is fine; anything else is a broken agent.

        - alert: PrepullerClusterDown
          expr: prepuller_cluster_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            title: {{ $app }}
            summary: Prepuller cluster backend is down
            description: The hub cannot get a consistent snapshot of the cluster for 2m (spoke unreachable or provider failing).

        # Hub age of the last successful sync. The hub bounds each snapshot at
        # 3s, so a growing age is a stuck collector, not a slow scrape.
        - alert: PrepullerSnapshotStale
          expr: 'prepuller_snapshot_age_seconds > {{ $thresholds.snapshotAge }}'
          for: 5m
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Hub snapshot is stale
            description: No successful snapshot for more than {{ $thresholds.snapshotAge }}s; the hub is serving old data.

        # The hub gives up on a snapshot after its own timeout: the scrape is
        # blind and the UI shows stale state even though the process is up.
        - alert: PrepullerSnapshotScrapeTimeouts
          expr: increase(prepuller_snapshot_scrape_timeout_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Hub snapshot scrapes are timing out
            description: The hub hit its own snapshot bound; part of the cluster is unreachable from the hub.

        # Capacity is 0 on runtimes that do not report ImageFS capacity (e.g.
        # containerd on some immutable distros). The series is then absent and
        # this alert cannot fire; use a node-disk alert instead. The guard keeps
        # the expression from dividing by zero.
        - alert: PrepullerNodeImageFSHigh
          expr: 'prepuller_node_imagefs_capacity_bytes > 0 and (prepuller_node_imagefs_used_bytes / prepuller_node_imagefs_capacity_bytes) > {{ $thresholds.imagefsUsedRatio }}'
          for: 5m
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Node ImageFS usage is high
            description: ImageFS is above {{ $thresholds.imagefsUsedRatio }} of capacity. Clean up unused images or grow the disk.

        # internal/provider emits result="error" for failed pulls; "failed" is
        # tolerated in the regex so the alert survives a result-value rename.
        - alert: PrepullerPullFailures
          expr: sum by (cluster) (increase(prepuller_pull_total{result=~"error|failed"}[15m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            title: {{ $app }}
            summary: Image pulls are failing
            description: At least one pull failed in 15m. Check the agent logs and the registry.
{{- end }}
