# Default values for image-prepuller. See docs/DEPLOY.md for a full walkthrough.
#
# Stage note (integration): the live K8sProvider (client-go) and the node-agent
# HTTP/JSON API v1 are merged, so hub.mock defaults to false and the agent
# DaemonSet is enabled. Use hub.mock=true for demos/UI work without a cluster.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/vasyakrg/image-prepuller
  # Empty -> Chart.appVersion, i.e. the image published by the same release tag
  # (chart version == appVersion == vX.Y.Z). Never a placeholder and never a
  # moving "latest"; values.image.tag wins when set.
  # Production should pin an immutable tag: the sha-<commit> of the same build
  # that produced the chart (docs/DEPLOY.md 14.2).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the release fullname.
  name: ""
  annotations: {}

# RBAC for the hub/spoke controller: it lists Nodes and workloads through the
# Kubernetes API. The agent DaemonSet uses a separate ServiceAccount with no
# API permissions at all.
rbac:
  create: true
  # "get" on Secrets cluster-wide, used to resolve the imagePullSecrets of the
  # workloads being pre-pulled and pass the credential to the node agent (a CRI
  # pull is anonymous otherwise, so a private registry answers 403). The
  # controller never lists or writes Secrets. Set false when cluster policy
  # forbids reading Secrets: pulls then stay anonymous.
  readSecrets: true

# Annotations added to every pod template (hub, spoke, agent).
podAnnotations: {}

# Pod-level hardening shared by hub and spoke. The image runs as 65532:65532
# (distroless nonroot) and never writes to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level hardening shared by hub and spoke.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Credentials consumed by the controller. Leave "create: true" and empty
# password/sessionSecret/clusterToken to have random values generated on
# install (retrieve with `kubectl get secret ... -o jsonpath ...`).
# In production, set secret.existingSecret to a pre-created Secret that has the
# same keys (auth-user, auth-pass, session-secret, cluster-token, agent-token)
# and set create: false. A hub release additionally reads the optional
# "managed-clusters" key (PREPULLER_MANAGED_CLUSTERS, outbound mode).
secret:
  create: true
  existingSecret: ""
  auth:
    user: admin
    # Empty -> random 24 chars generated on install.
    password: ""
  # Empty -> random 64 chars. A stable value is REQUIRED for multiple hub
  # replicas: sessions are signed with it.
  sessionSecret: ""
  # Empty -> random 32 chars. Must match the token configured on the hub for
  # this spoke (PREPULLER_CLUSTER_TOKEN).
  clusterToken: ""
  # Empty -> random 32 chars. Bearer token of the node-agent HTTP API
  # (PREPULLER_AGENT_TOKEN). Empty on the agent disables its auth.
  agentToken: ""
  # Optional multi-user list for PREPULLER_USERS: "name:password:role,..."
  # (roles viewer/operator). Empty keeps the legacy single auth-user/password.
  # NOTE: main.go currently passes only the legacy pair to auth.NewManager;
  # multi-user needs the integrator to wire auth.UsersFromEnv (see DEPLOY.md).
  users: ""

hub:
  # Hub: Web UI, cookie auth, cluster registry and Prometheus. Disable it to
  # install only the node agents (e.g. a spoke-only or agent-only cluster).
  enabled: true
  replicaCount: 1
  # false -> live K8sProvider (client-go + node agents). Set true to run the
  # in-memory mock (`-mock`) for demos/UI work; the live path needs the RBAC
  # below and a reachable Kubernetes API from the pod.
  mock: false
  clusterName: talos-prod-eu
  # -auto-warm starts the reconciler for local clusters (Stage 2/3).
  autoWarm: true
  # Optional login rate-limit overrides (PREPULLER_LOGIN_ATTEMPTS_PER_MINUTE /
  # PREPULLER_LOGIN_BLOCK). Empty = internal/auth defaults.
  loginRateLimit:
    attemptsPerMinute: ""
    block: ""
  # Secure cookie attribute. Keep true behind TLS ingress; set false only for
  # plain-HTTP local development.
  cookieSecure: true
  # Direct ("push") mode: extra spokes in PREPULLER_REMOTE_CLUSTERS format
  # "name=url=token,name2=url2=token2". The hub calls each spoke URL itself, so
  # the hub must be able to reach it (same network, or a route into the managed
  # cluster). Use it for spokes the hub can reach directly.
  remoteClusters: ""
  # Outbound ("pull") mode. Map of managed cluster name -> its cluster token,
  # rendered as PREPULLER_MANAGED_CLUSTERS ("name=token,name2=token2"). A spoke
  # started with -hub-url registers here; it dials this hub's ingress, so no
  # inbound route into the managed cluster is needed. Prefer a pre-created
  # secret.existingSecret with the same "managed-clusters" key in production.
  managedClusters: ""
  # Kubernetes label selector of the workloads this controller manages. Workloads
  # without the label are not listed, not shown in the UI and cannot be pulled:
  # the product warms only what is explicitly opted in. Empty string = every
  # workload. Example: "prepull=true".
  workloadSelector: "prepull=true"
  # Kubernetes label selector of the nodes in scope ("" = every node). When the
  # agent DaemonSet runs on workers only, exclude control-plane nodes here and
  # their missing agents stop showing up as offline slots/warnings:
  # "!node-role.kubernetes.io/control-plane". Nodes outside the scope are not
  # shown, not counted in coverage and never pulled to.
  nodeLabelSelector: ""
  service:
    type: ClusterIP
    httpPort: 8080
    metricsPort: 9090
  # Ingress lives under hub: it only ever exposes the hub UI/API. Managed
  # clusters (agent-only or spoke-only releases) never carry an ingress.
  ingress:
    enabled: false
    # Traefik accepts the standard Ingress class name, e.g. "traefik".
    className: ""
    annotations: {}
    hosts:
      - host: prepuller.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Adds prometheus.io/scrape|port|path pod annotations for the metrics port.
  # Keep it for annotation-based scraping; use hub.serviceMonitor.enabled for
  # prometheus-operator (a stable job label instead of per-pod annotations).
  metrics:
    annotations: true
  # ServiceMonitor for the hub metrics Service (prometheus-operator CRD). It
  # lives under hub because only a hub release owns that Service: an
  # agent-only/managed release has nothing for the monitor to select. Selects
  # the Service on its named "metrics" port, so the job label stays stable
  # across pod restarts. Requires monitoring.coreos.com/v1: the template fails
  # with a clear message when the CRD is missing.
  serviceMonitor:
    enabled: false
    # Extra labels so your Prometheus selects the monitor, e.g.
    # release: kube-prometheus-stack.
    labels: {}
    # Extra annotations on the ServiceMonitor object.
    annotations: {}
    interval: 30s
    # The hub bounds each snapshot at 3 s while it waits for dead agents, so keep
    # the scrape timeout well above that: with the usual 10 s the whole target
    # drops out exactly during an incident (docs/DEPLOY.md 14.8).
    scrapeTimeout: 15s
    # Metric relabelings applied at scrape time (rendered verbatim).
    metricRelabelings: []
  # PrometheusRule with the hub/cluster alerts (prometheus-operator CRD): node
  # agent down, cluster partial/down, stale snapshot, ImageFS usage, failing
  # pulls. Also rendered for a spoke-only release, because the spoke exposes the
  # same cluster series on its own metrics port. Agent-process alerts live under
  # agent.metrics.prometheusRule. Enable it only when the CRD is installed and
  # the operator's rule selector matches this namespace; thresholds are values
  # so a cluster can tune them without forking the chart. See docs/alerts.md.
  prometheusRule:
    enabled: false
    # Extra labels on the PrometheusRule object, e.g. release: kube-prometheus-stack,
    # so the operator's ruleSelector picks it up.
    labels: {}
    # Extra annotations on the PrometheusRule object (not on the individual alerts).
    annotations: {}
    thresholds:
      # Seconds an agent may stay down while its node is Ready.
      nodeAgentDown: 120
      # Seconds a cluster snapshot may stay partial.
      clusterPartial: 600
      # Seconds since the hub's last successful sync with the cluster.
      snapshotAge: 120
      # ImageFS used ratio (0..1) that raises the node disk alert.
      imagefsUsedRatio: 0.85
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Extra environment variables (list of name/value or name/valueFrom).
  extraEnv: []

spoke:
  # Headless backend for one managed cluster. Deploy one release (or one
  # spoke.enabled release) per spoke cluster; the hub reaches it over HTTPS.
  enabled: false
  mock: true
  clusterName: talos-prod-kz
  replicaCount: 1
  # Outbound ("pull") mode: the spoke dials the hub ingress instead of being
  # exposed on the managed cluster's DNS. Required when the hub cannot reach
  # the managed cluster (NAT, no ingress there). replicaCount must stay 1 in
  # this mode: the command queue assumes a single spoke replica.
  hub:
    enabled: false
    # Hub base URL, e.g. https://prepuller.example.com (hub.ingress host).
    url: ""
    # How often the spoke pushes cluster state to the hub.
    syncInterval: 3s
  # Workload/node scope of this spoke (same meaning as under hub: the spoke runs
  # its own K8sProvider against the cluster it manages).
  workloadSelector: "prepull=true"
  nodeLabelSelector: ""
  service:
    type: ClusterIP
    httpPort: 8081
    metricsPort: 9091
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  metrics:
    annotations: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

agent:
  # Per-node DaemonSet serving the agent HTTP/JSON API v1 (WS-A). The live
  # K8sProvider in the hub talks to it on each node's InternalIP:9443.
  enabled: true
  # Dedicated ServiceAccount for the DaemonSet: no Kubernetes API permissions.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # false -> talk to the real CRI socket; true -> in-memory mock images.
  mock: false
  # The agent pod uses hostNetwork, so the hub reaches it on Node.InternalIP:port.
  # k3s/k3d keep containerd under /run/k3s: set this to
  # /run/k3s/containerd/containerd.sock there (see docs/DEPLOY.md section 12).
  criSocket: /run/containerd/containerd.sock
  # HTTP/JSON listen address of the agent (cmd/prepuller/agent.go -listen-addr).
  port: 9443
  # Prometheus metrics of the agent: hand-written text exposition 0.0.4 on a
  # separate port, no auth. Scrapes must never be able to block the hub's
  # snapshot traffic, so metrics do not share agent.port.
  metrics:
    enabled: true
    # Metrics listen port (the agent serves /metrics here).
    port: 9444
    # Adds prometheus.io/scrape|port|path pod annotations so a Prometheus that
    # discovers pods picks the agent up without a ServiceMonitor.
    annotations: true
    service:
      # The agent is hostNetwork, so the Service endpoints are node IPs. A
      # headless Service is not needed: each endpoint is already one node.
      type: ClusterIP
      # Defaults to <fullname>-agent-metrics.
      name: ""
    # ServiceMonitor for the agent metrics Service. It lives under the metrics
    # section because it scrapes exactly that listener: it requires
    # agent.metrics.enabled and monitoring.coreos.com/v1. Agents are scraped from
    # :9444 and often live in a different scrape budget than the hub, which is
    # why this is not a hub-level monitor.
    serviceMonitor:
      enabled: false
      labels: {}
      annotations: {}
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings: []
    # PrometheusRule with the agent-process alerts (prepuller_agent_* from
    # :9444): scrape target down, no hub contact, 401/403, CRI down, stalled
    # pull. Requires agent.metrics.enabled; hub/cluster alerts are a separate
    # object under hub.prometheusRule.
    prometheusRule:
      enabled: false
      labels: {}
      annotations: {}
      thresholds:
        # Seconds without a hub request to the agent /agent/v1/snapshot endpoint.
        agentNoContact: 180
  # NetworkPolicy for the agent DaemonSet: ingress from this release's pods to
  # the agent API port, egress DNS + TCP 443 (registries). The agent runs with
  # hostNetwork, where NetworkPolicy is not enforced by most CNIs; on such
  # clusters restrict 9443/9444 on the node firewall instead (docs/DEPLOY.md).
  networkPolicy:
    enabled: false
  diskPauseRatio: 0.78
  # Pull hygiene: a pull into a dead registry must not hold an image x node slot
  # for ten minutes (cmd/prepuller/agent.go, internal/agent/server.go).
  pull:
    # Bound on one whole CRI pull (backstop for genuinely slow downloads).
    timeout: 10m
    # Dial the registry before pulling so a black-holed registry fails in
    # seconds instead of minutes. Disable when containerd pulls through a
    # registry mirror or an HTTP proxy from its own config: the runtime can
    # reach the image, a direct dial from the agent cannot.
    registryProbe: true
    registryProbeTimeout: 5s
    # Cancel a pull that stops growing the image filesystem: the CRI pull API
    # has no progress callback, so this is the only stall signal the agent has.
    stallWatch: true
    stallTimeout: 60s
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Reading the containerd socket requires root or a supplemental group that
  # owns it. Keep 0 until WS-A adds group-based socket access, then switch to
  # 65532 plus supplementalGroups: [<containerd gid>]. Root filesystem stays
  # read-only either way.
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  nodeSelector: {}
  tolerations: []
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  # kubectl drain/upgrade knob: the DaemonSet tolerates control-plane taints
  # only if listed here.
